plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def uploadKeystorePath = System.getenv('LLE_COMPANION_UPLOAD_KEYSTORE')
def uploadStorePassword = System.getenv('LLE_COMPANION_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('LLE_COMPANION_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('LLE_COMPANION_UPLOAD_KEY_PASSWORD')
def hasPlayUploadSigning = [
    uploadKeystorePath,
    uploadStorePassword,
    uploadKeyAlias,
    uploadKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.codex.lle.companion'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.codex.lle.companion'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
        buildConfigField 'String', 'VERSION_FILE_URL', '"https://raw.githubusercontent.com/Brazzo978/L.L.E-Legacy-Lockscreen-Effects/main/LLE_VERSION.txt"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPlayUploadSigning) {
                signingConfig signingConfigs.create('playUpload') {
                    storeFile file(uploadKeystorePath)
                    storePassword uploadStorePassword
                    keyAlias uploadKeyAlias
                    keyPassword uploadKeyPassword
                    storeType 'PKCS12'
                }
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!hasPlayUploadSigning) {
            throw new GradleException(
                'Play upload signing is missing. Use scripts/build-play-bundle.ps1.'
            )
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
